<!DOCTYPE html><html lang="cs"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Prompts Translator - AI</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Syne:wght@400;600;700;800&display=swap');
:root{--bg:#0d0f14;--surface:#151820;--surface2:#1c2030;--border:#252a3a;--accent:#4f8ef7;--accent2:#f7934f;--accent3:#4ff7a0;--text:#c8d0e8;--text-dim:#606880;--text-bright:#eef2ff;--highlight:rgba(79,142,247,0.12);--highlight-warn:rgba(247,147,79,0.12);--danger:#f7504f;--mono:"JetBrains Mono",monospace;--sans:Syne,sans-serif}
*{box-sizing:border-box;margin:0;padding:0}body{background:var(--bg);color:var(--text);font-family:var(--sans);min-height:100vh;overflow-x:hidden}
header{background:var(--surface);border-bottom:1px solid var(--border);padding:16px 24px;display:flex;align-items:center;gap:16px;position:sticky;top:0;z-index:100;flex-wrap:wrap}
header h1{font-size:18px;font-weight:800;color:var(--text-bright);letter-spacing:-0.5px}header h1 span{color:var(--accent)}
.hdr-r{margin-left:auto;display:flex;gap:8px;align-items:center}
.app{display:grid;grid-template-columns:300px 1fr;height:calc(100vh - 57px)}
.sidebar{background:var(--surface);border-right:1px solid var(--border);overflow-y:auto;display:flex;flex-direction:column}
.sidebar-section{padding:12px 16px 8px;font-size:10px;font-weight:700;letter-spacing:1.5px;color:var(--text-dim);text-transform:uppercase;border-top:1px solid var(--border)}
.sidebar-section:first-child{border-top:none}
.upload-zone{margin:12px;border:1.5px dashed var(--border);border-radius:8px;padding:16px;text-align:center;cursor:pointer;transition:all .2s;font-size:12px;color:var(--text-dim)}
.upload-zone:hover{border-color:var(--accent);color:var(--accent);background:var(--highlight)}.upload-zone.has-file{border-color:var(--accent3);color:var(--accent3)}
.upload-zone input{display:none}.upload-icon{font-size:20px;margin-bottom:6px}
.lang-list{padding:8px;flex:1;overflow-y:auto}
.lang-item{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:6px;cursor:pointer;font-size:13px;transition:background .15s;border:1px solid transparent}
.lang-item:hover{background:var(--surface2)}.lang-item.active{background:var(--highlight);border-color:var(--accent);color:var(--accent)}
.lang-item.done{color:var(--accent3)}.lang-item.done .lang-status{color:var(--accent3)}
.lang-code{font-family:var(--mono);font-size:10px;background:var(--surface2);padding:2px 5px;border-radius:3px;color:var(--text-dim);min-width:40px;text-align:center}
.lang-status{margin-left:auto;font-size:11px;color:var(--text-dim)}
.btn-ta{margin:8px;padding:10px;background:var(--accent);color:#fff;border:none;border-radius:8px;font-family:var(--sans);font-weight:700;font-size:13px;cursor:pointer;transition:opacity .2s}
.btn-ta:hover{opacity:.85}.btn-ta:disabled{opacity:.4;cursor:default}
.btn-da{margin:0 8px 8px;padding:10px;background:var(--accent3);color:#0d0f14;border:none;border-radius:8px;font-family:var(--sans);font-weight:700;font-size:13px;cursor:pointer;transition:opacity .2s}
.btn-da:hover{opacity:.85}.btn-da:disabled{opacity:.4;cursor:default}
.main{overflow-y:auto;display:flex;flex-direction:column}
.tabs{display:flex;border-bottom:1px solid var(--border);background:var(--surface);padding:0 20px;gap:4px;flex-shrink:0}
.tab{padding:12px 16px;font-size:12px;font-weight:600;color:var(--text-dim);cursor:pointer;border-bottom:2px solid transparent;transition:all .15s;white-space:nowrap}
.tab:hover{color:var(--text)}.tab.active{color:var(--accent);border-bottom-color:var(--accent)}
.panel{display:none;flex:1;overflow-y:auto}.panel.active{display:block}
.prompts-view{padding:20px}
.prompt-group{margin-bottom:24px;background:var(--surface);border:1px solid var(--border);border-radius:10px;overflow:hidden}
.prompt-group-header{padding:10px 16px;background:var(--surface2);font-size:10px;font-weight:700;letter-spacing:1px;color:var(--text-dim);text-transform:uppercase;display:flex;align-items:center;gap:8px}
.prompt-group-header .badge{background:var(--accent);color:#fff;padding:1px 6px;border-radius:10px;font-size:9px}
.prompt-item{padding:12px 16px;border-top:1px solid var(--border);display:flex;flex-direction:column;gap:6px}
.prompt-item:first-child{border-top:none}.prompt-key{font-family:var(--mono);font-size:10px;color:var(--accent2);word-break:break-all}
.prompt-value{font-size:12px;line-height:1.6;color:var(--text);white-space:pre-wrap;word-break:break-word;padding:8px 10px;background:var(--surface2);border-radius:6px;border-left:2px solid var(--border)}
.lang-token{background:rgba(79,142,247,0.2);border:1px solid var(--accent);border-radius:3px;padding:0 3px;color:var(--accent);font-weight:600;cursor:pointer}
.lang-token:hover{background:rgba(79,142,247,0.35)}
.translations-view{padding:20px}
.trans-lang-header{display:flex;align-items:center;gap:12px;margin-bottom:16px;padding-bottom:12px;border-bottom:1px solid var(--border)}
.trans-lang-name{font-size:22px;font-weight:800;color:var(--text-bright)}
.trans-lang-code{font-family:var(--mono);font-size:13px;color:var(--accent);background:var(--highlight);padding:3px 8px;border-radius:5px}
.btn-export{margin-left:auto;padding:8px 16px;background:var(--accent3);color:#0d0f14;border:none;border-radius:7px;font-family:var(--sans);font-weight:700;font-size:12px;cursor:pointer}
.btn-export:hover{opacity:.85}.btn-retranslate{padding:8px 16px;background:transparent;color:var(--accent);border:1px solid var(--accent);border-radius:7px;font-family:var(--sans);font-weight:700;font-size:12px;cursor:pointer}
.subs-view{padding:20px}.subs-info{background:var(--highlight-warn);border:1px solid var(--accent2);border-radius:8px;padding:12px 16px;font-size:12px;line-height:1.6;margin-bottom:20px;color:var(--text)}
.subs-info strong{color:var(--accent2)}.subs-table{width:100%;border-collapse:collapse}
.subs-table th{text-align:left;font-size:10px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--text-dim);padding:8px 12px;border-bottom:1px solid var(--border)}
.subs-table td{padding:6px 12px;border-bottom:1px solid var(--border);vertical-align:middle}.subs-table tr:hover td{background:var(--surface2)}
.subs-table input{background:var(--surface2);border:1px solid var(--border);border-radius:5px;padding:5px 8px;color:var(--text);font-family:var(--mono);font-size:11px;width:100%}
.subs-table input:focus{outline:none;border-color:var(--accent)}.subs-lang-col{font-family:var(--mono);font-size:11px;color:var(--accent)}.subs-cs-col{font-size:12px;color:var(--text-dim)}
.btn-add-sub{margin-top:12px;padding:8px 16px;background:var(--surface2);border:1px dashed var(--border);border-radius:7px;color:var(--text-dim);cursor:pointer;font-family:var(--sans);font-size:12px}
.btn-add-sub:hover{border-color:var(--accent);color:var(--accent)}.btn-del{background:none;border:none;color:var(--danger);cursor:pointer;font-size:14px;padding:4px}
.progress-overlay{position:fixed;inset:0;background:rgba(13,15,20,0.85);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:999;gap:16px}
.progress-box{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:32px 40px;min-width:360px;text-align:center}
.progress-title{font-size:16px;font-weight:700;color:var(--text-bright);margin-bottom:8px}
.progress-sub{font-size:12px;color:var(--text-dim);margin-bottom:20px}
.progress-bar-wrap{background:var(--surface2);border-radius:10px;height:6px;overflow:hidden}
.progress-bar{height:100%;background:var(--accent);border-radius:10px;transition:width .3s}
.progress-lang{font-family:var(--mono);font-size:13px;color:var(--accent);margin-top:12px}
.toast{position:fixed;bottom:24px;right:24px;background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:10px 16px;font-size:13px;color:var(--text-bright);z-index:9999;transition:all .3s;transform:translateY(80px);opacity:0}
.toast.show{transform:translateY(0);opacity:1}.toast.ok{border-color:var(--accent3)}.toast.err{border-color:var(--danger)}
.hidden{display:none!important}
::-webkit-scrollbar{width:6px} ::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}::-webkit-scrollbar-thumb:hover{background:#353a50}
.ai-bar{display:none;padding:8px 16px;background:var(--surface2);border-bottom:1px solid var(--border);gap:8px;align-items:center;flex-wrap:wrap}
.ai-bar.active{display:flex}
.ai-bar label{font-size:11px;color:var(--text-dim);min-width:60px}
.ai-bar select,.ai-bar input{background:var(--surface);border:1px solid var(--border);border-radius:5px;padding:4px 8px;color:var(--text);font-size:11px;font-family:var(--mono)}
.ai-bar input{min-width:160px}.key-status{font-size:10px;margin-left:6px}
.key-status.ok{color:var(--accent3)}.key-status.err{color:var(--danger)}
.prv-row{display:flex;gap:4px;margin-bottom:6px;flex-wrap:wrap}
.prv-tab{padding:3px 10px;font-size:11px;border-radius:4px;cursor:pointer;background:var(--surface);color:var(--text-dim);border:1px solid var(--border);font-family:var(--sans)}
.prv-tab.active{background:var(--accent);color:#fff;border-color:var(--accent)}
</style></head><body>
